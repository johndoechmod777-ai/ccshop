        // SISTEMA DE SALDO
        async function cargarSaldoUsuario() {
            if (!usuarioActual) return;
            
            const userRef = rtdb.ref('users/' + usuarioActual.uid);
            
            const snapshotCheck = await userRef.once('value');
            if (!snapshotCheck.exists()) {
                await userRef.set({
                    saldo: 0,
                    ultimoAcceso: Date.now(),
                    email: usuarioActual.email
                });
            }
            
            unsubscribeSaldo = userRef.on('value', (snapshot) => {
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    saldoActual = parseFloat(userData.saldo || 0);
                    document.getElementById('saldoUsuario').textContent = saldoActual.toFixed(2);

                } else {

        function actualizarBotonesCompra() {
            document.querySelectorAll('.buy-btn').forEach(btn => {
                const precioMatch = btn.textContent.match(/\$(\d+)/);
                const precio = precioMatch ? parseInt(precioMatch[1]) : 0;
                if (saldoActual < precio) {
                    btn.disabled = true;
                    btn.innerHTML = `❌ SALDO - $${precio}`;
                } else {
                    btn.disabled = false;
                    btn.innerHTML = `🛒 COMPRAR - $${precio}`;
                }
            });
        }

        // BLOQUEO GLOBAL
        async function adquirirBloqueoGlobal(productoId) {
            const bloqueoId = `bloqueo_${usuarioActual.uid}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            try {
                await rtdb.ref(`bloqueos/${productoId}`).set({
                    id: bloqueoId,
                    usuario: usuarioActual.uid,
                    timestamp: Date.now(),
                    email: usuarioActual.email
                });
                return bloqueoId;
            } catch (error) {
                throw new Error('NO_SE_PUDO_BLOQUEAR');
            }
        }

        async function verificarBloqueoGlobal(productoId, bloqueoId) {
            try {
                const snapshot = await rtdb.ref(`bloqueos/${productoId}`).once('value');
                const bloqueo = snapshot.val();
                return bloqueo && bloqueo.id === bloqueoId;
            } catch (error) {
                return false;
            }
        }

        async function liberarBloqueoGlobal(productoId, bloqueoId) {
            try {
                if (await verificarBloqueoGlobal(productoId, bloqueoId)) {
                    await rtdb.ref(`bloqueos/${productoId}`).remove();

            } catch (error) {

        async function limpiarBloqueosExpiradosGlobales() {
            try {
                const snapshot = await rtdb.ref('bloqueos').once('value');
                const ahora = Date.now();
                const updates = {};
                snapshot.forEach((childSnapshot) => {
                    const bloqueo = childSnapshot.val();
                    if (ahora - bloqueo.timestamp > 30000) {
                        updates[childSnapshot.key] = null;
                    }
                });
                if (Object.keys(updates).length > 0) {
                    await rtdb.ref('bloqueos').update(updates);
                }
            } catch (error) {
            }
        }

        function actualizarPaginacion() {
            const totalPaginas = Math.ceil(dumpsFiltrados.length / itemsPorPagina);
            const info = document.getElementById('paginationInfo');
            info.textContent = `Página ${paginaActual} de ${totalPaginas} (${dumpsFiltrados.length} elementos)`;

            const prevBtn = document.getElementById('prevPage');
            const nextBtn = document.getElementById('nextPage');
            prevBtn.disabled = paginaActual <= 1;
            nextBtn.disabled = paginaActual >= totalPaginas;

            const pageNumbers = document.getElementById('pageNumbers');
            let pagesHTML = '';

            const maxVisible = 5;
            let inicioPag = Math.max(1, paginaActual - Math.floor(maxVisible / 2));
            let finPag = Math.min(totalPaginas, inicioPag + maxVisible - 1);

            if (finPag - inicioPag + 1 < maxVisible) {
                inicioPag = Math.max(1, finPag - maxVisible + 1);
            }

            if (inicioPag > 1) {
                pagesHTML += `<span class="page-ellipsis">...</span>`;
            }

            for (let i = inicioPag; i <= finPag; i++) {
                pagesHTML += `<button class="page-btn ${i === paginaActual ? 'active' : ''}" onclick="irAPagina(${i})">${i}</button>`;
            }

            if (finPag < totalPaginas) {
                pagesHTML += `<span class="page-ellipsis">...</span>`;
            }

            pageNumbers.innerHTML = pagesHTML;
        }

        function cambiarPagina(delta) {
            const totalPaginas = Math.ceil(dumpsFiltrados.length / itemsPorPagina);
            const nuevaPagina = Math.max(1, Math.min(totalPaginas, paginaActual + delta));
            if (nuevaPagina !== paginaActual) {
                paginaActual = nuevaPagina;
                mostrarDumpsPagina();
                actualizarPaginacion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function irAPagina(numPagina) {
            const totalPaginas = Math.ceil(dumpsFiltrados.length / itemsPorPagina);
            if (numPagina >= 1 && numPagina <= totalPaginas && numPagina !== paginaActual) {
                paginaActual = numPagina;
                mostrarDumpsPagina();
                actualizarPaginacion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function manejarErrorCompra(error, id, btnElement, precio) {
            if (error.message === 'YA_VENDIDO' || error.message === 'PRODUCTO_NO_EXISTE') {
                showNotification('❌ Producto ya no disponible', 'error');
                todosLosDumps = todosLosDumps.filter(d => d.id !== id);
                dumpsFiltrados = dumpsFiltrados.filter(d => d.id !== id);
                const totalPaginas = Math.ceil(dumpsFiltrados.length / itemsPorPagina);
                if (paginaActual > totalPaginas && totalPaginas > 0) {
                    paginaActual = totalPaginas;
                }
                actualizarEstadisticas();
                actualizarPaginacion();
                mostrarDumpsPagina();
            } else if (error.message === 'SALDO_INSUFICIENTE' || error.message === 'USUARIO_NO_ENCONTRADO') {
                showNotification('❌ Saldo insuficiente - Debes recargar', 'error');
                cargarSaldoUsuario();
            } else if (error.message === 'BLOQUEO_PERDIDO' || error.message === 'NO_SE_PUDO_BLOQUEAR') {
                showNotification('❌ Producto en proceso de compra por otro usuario', 'error');
            } else if (error.message === 'CANCELADA') {
                // Usuario canceló, no hacer nada
            } else {
                showNotification('❌ Error inesperado: ' + error.message, 'error');
            }
            if (btnElement) {
                btnElement.disabled = false;
                btnElement.innerHTML = `🛒 COMPRAR - $${precio}`;
            }
        }

        // COMPRA (incluye soporte para tarjeta fija)
        async function comprarDump(id, precio, btnElement) {
            
            if (!usuarioActual) {
                showNotification('❌ Debes iniciar sesión', 'error');
                return;
            }

            // Verificar si es la tarjeta fija
            const esTarjetaFija = (id === TARJETA_FIJA.id);
            
            let dumpData = null;
            
            if (esTarjetaFija) {
                // Buscar en la lista local
                dumpData = todosLosDumps.find(d => d.id === id);
                if (!dumpData || dumpData.vendido) {
                    showNotification('❌ Producto ya no disponible', 'error');
                    return;
                }
            } else {
                // Verificar en Firebase
                try {
                    const verif = await db.collection("dumps").doc(id).get();
                    if (!verif.exists || verif.data().vendido) {
                        showNotification('❌ Producto ya no disponible', 'error');
                        setTimeout(() => cargarDumpsVisa(), 300);
                        return;
                    }
                    dumpData = verif.data();
                } catch (error) {
                    showNotification('❌ Error verificando', 'error');
                    return;
                }
            }

            if (saldoActual < precio) {
                showNotification('❌ Saldo insuficiente', 'error');
                return;
            }

            let bloqueoId;
            try {
                bloqueoId = await adquirirBloqueoGlobal(id);
            } catch (error) {
                manejarErrorCompra(error, id, btnElement, precio);
                return;
            }

            try {
                btnElement.disabled = true;
                btnElement.innerHTML = '🔍 Verificando...';

                if (!confirm(`¿Confirmar compra por $${precio} USD?\n\nDatos se enviarán a tu email y historial.`)) {
                    throw new Error('CANCELADA');
                }

                btnElement.innerHTML = '⏳ Procesando...';

                // Actualizar saldo
                const userRef = rtdb.ref('users/' + usuarioActual.uid);
                const userSnapshot = await userRef.once('value');
                if (!userSnapshot.exists()) throw new Error('USUARIO_NO_ENCONTRADO');
                const userData = userSnapshot.val();
                const nuevoSaldo = (userData.saldo || 0) - precio;
                if (nuevoSaldo < 0) throw new Error('SALDO_INSUFICIENTE');

                await userRef.update({ saldo: nuevoSaldo, ultimoAcceso: Date.now() });

                let datosOriginales = dumpData;
                
                if (!esTarjetaFija) {
                    // Transacción para Firebase
                    await db.runTransaction(async (transaction) => {
                        const dumpRef = db.collection("dumps").doc(id);
                        const dumpSnap = await transaction.get(dumpRef);
                        
                        if (!dumpSnap.exists || dumpSnap.data().vendido) {
                            throw new Error('YA_VENDIDO');
                        }

                        if (!await verificarBloqueoGlobal(id, bloqueoId)) {
                            throw new Error('BLOQUEO_PERDIDO');
                        }

                        const data = dumpSnap.data();
                        transaction.update(dumpRef, {
                            vendido: true,
                            comprado_por: usuarioActual.uid,
                            fecha_compra: new Date(),
                            timestamp_compra: Date.now()
                        });

                        datosOriginales = data;
                        return data;
                    });
                } else {
                    // Para la tarjeta fija, marcarla como vendida localmente
                    const index = todosLosDumps.findIndex(d => d.id === id);
                    if (index !== -1) {
                        todosLosDumps[index].vendido = true;
                    }
                    const indexFiltrado = dumpsFiltrados.findIndex(d => d.id === id);
                    if (indexFiltrado !== -1) {
                        dumpsFiltrados[indexFiltrado].vendido = true;
                    }
                }

                // Actualizar listas locales
                if (!esTarjetaFija) {
                    todosLosDumps = todosLosDumps.filter(d => d.id !== id);
                    dumpsFiltrados = dumpsFiltrados.filter(d => d.id !== id);
                } else {
                    // Para tarjeta fija, filtrar si está vendida
                    todosLosDumps = todosLosDumps.filter(d => d.id !== id || !d.vendido);
                    dumpsFiltrados = dumpsFiltrados.filter(d => d.id !== id || !d.vendido);
                }
                
                const totalPaginas = Math.ceil(dumpsFiltrados.length / itemsPorPagina);
                if (paginaActual > totalPaginas && totalPaginas > 0) paginaActual = totalPaginas;

                // Notificar global (solo si no es fija)
                if (!esTarjetaFija) {
                    await rtdb.ref('productos_vendidos').push({
                        id: id,
                        vendido_por: usuarioActual.uid,
                        timestamp: Date.now()
                    });
                }

                // Post-compra: email y historial
                const emailEnviado = await enviarEmailDump(datosOriginales, precio, id);
                await guardarEnHistorial(datosOriginales, precio, id);

                // Actualizar UI
                actualizarEstadisticas();
                actualizarPaginacion();
                mostrarDumpsPagina();
                btnElement.innerHTML = '✅ COMPRADO';
                showNotification('✅ ¡Compra exitosa! Revisa tu email.', 'success');

            } catch (error) {
                await liberarBloqueoGlobal(id, bloqueoId);
                manejarErrorCompra(error, id, btnElement, precio);
            }
        }

        // AUTENTICACIÓN
        function verificarAutenticacion() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    usuarioActual = user;
                    cargarSaldoUsuario();
                    generarBotonesPaises();
                    cargarDumpsVisa();
                    inicializarSincronizacionGlobal();
                } else {
                    showNotification('⚠️ Inicia sesión primero', 'error');
                    setTimeout(() => window.location.href = "index.html", 2000);
                }
            });
        }

        // INICIALIZACIÓN
        document.addEventListener('DOMContentLoaded', function() {
            verificarAutenticacion();
        });
    </script>
</body>
</html>
