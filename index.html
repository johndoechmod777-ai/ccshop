<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCshop - Acceso Exclusivo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='text' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23ff0000'/><stop offset='100%' stop-color='%23cc0000'/></stop></linearGradient></defs><path d='M8 8 L24 8 L24 24 L8 24 Z' transform='rotate(45 16 16)' fill='none' stroke='%23ff0000' stroke-width='1.5'/><text x='12' y='20' text-anchor='middle' fill='url(%23text)' font-family='Arial' font-weight='bold' font-size='12'>C</text><text x='20' y='20' text-anchor='middle' fill='url(%23text)' font-family='Arial' font-weight='bold' font-size='12'>C</text></svg>">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap');
        
        body { 
            background: #050505;
            font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif; 
            min-height: 100vh; 
            color: white; 
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; 
            transition: opacity 0.8s ease;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #ff0000;
            border-radius: 50%;
            opacity: 0;
            animation: float 10s infinite;
            box-shadow: 0 0 6px #ff0000;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        .background-video { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: -3; 
            display: none; 
            opacity: 0.4;
            filter: brightness(0.4) contrast(1.2);
        }
        
        .container { 
            text-align: center; 
            width: 90%; 
            max-width: 420px; 
            padding: 30px 25px;
            background: rgba(8, 8, 8, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 0, 0, 0.4);
            box-shadow: 
                0 0 20px rgba(255, 0, 0, 0.2),
                inset 0 0 20px rgba(255, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            animation: containerFade 0.5s ease-out;
        }

        @keyframes containerFade {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff0000, transparent);
            animation: scan 3s linear infinite;
            opacity: 0.5;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .logo-container { 
            margin-bottom: 20px; 
            position: relative;
            display: inline-block;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff0000 0%, #ff3333 50%, #cc0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            letter-spacing: 4px;
            position: relative;
            display: inline-block;
            animation: logoPulse 2s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { 
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
                transform: scale(1);
            }
            50% { 
                text-shadow: 0 0 40px rgba(255, 0, 0, 0.9);
                transform: scale(1.02);
            }
        }

        .logo::before,
        .logo::after {
            content: 'CCSHOP';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff0000 0%, #ff3333 50%, #cc0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo::before {
            animation: glitch1 2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
        }

        .logo::after {
            animation: glitch2 3s infinite linear alternate-reverse;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
        }

        @keyframes glitch1 {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-2px, 0); }
            94% { transform: translate(2px, 0); }
            96% { transform: translate(-1px, 0); }
        }

        @keyframes glitch2 {
            0%, 85%, 100% { transform: translate(0); }
            87% { transform: translate(2px, 0); }
            89% { transform: translate(-2px, 0); }
            91% { transform: translate(1px, 0); }
        }

        .security-video { 
            width: 100%; 
            height: 140px;
            margin-bottom: 15px; 
            object-fit: cover; 
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.3);
        }

        .security-title { 
            color: #fff; 
            font-size: 18px; 
            margin-bottom: 15px; 
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            line-height: 1.2;
        }

        .anonymity-warning {
            background: rgba(255, 0, 0, 0.08);
            border: 1px solid rgba(255, 0, 0, 0.6);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            color: #ff6666;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: warningFlicker 1.5s ease-in-out infinite;
            line-height: 1.3;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.1);
        }

        @keyframes warningFlicker {
            0%, 100% { 
                border-color: rgba(255, 0, 0, 0.4); 
                opacity: 0.9;
            }
            50% { 
                border-color: rgba(255, 0, 0, 0.9); 
                opacity: 1;
            }
        }

        .google-button { 
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            color: white; 
            border: 1px solid rgba(255, 0, 0, 0.5); 
            border-radius: 12px; 
            padding: 14px 20px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.3s ease; 
            width: 100%; 
            position: relative;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .google-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .google-button:hover::before {
            left: 100%;
        }
        
        .google-button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.3);
            border-color: rgba(255, 0, 0, 0.8);
            background: linear-gradient(135deg, #2a2a2a 0%, #3a3a3a 100%);
        }
        
        .google-icon { 
            width: 20px; 
            height: 20px; 
            margin-right: 10px;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.5));
        }

        .login-epic {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #000; 
            display: none;
            justify-content: center; 
            align-items: center; 
            z-index: 9999; 
            flex-direction: column;
            overflow: hidden;
        }

        .login-epic.active {
            display: flex;
            animation: epicBgPulse 1.5s ease-out;
        }

        @keyframes epicBgPulse {
            0% { background: #000; }
            50% { background: #1a0000; }
            100% { background: #000; }
        }

        .energy-ring {
            width: 120px;
            height: 120px;
            border: 2px solid transparent;
            border-top: 2px solid #ff0000;
            border-right: 2px solid #ff3333;
            border-radius: 50%;
            position: relative;
            animation: energySpin 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .energy-ring::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid rgba(255, 0, 0, 0.5);
            border-radius: 50%;
            animation: pulseRing 1.5s ease-out;
        }

        @keyframes energySpin {
            0% { transform: rotate(0deg) scale(0.3); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: rotate(720deg) scale(1); opacity: 0; }
        }

        @keyframes pulseRing {
            0%, 100% { transform: scale(0.8); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .epic-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-top: 20px;
            opacity: 0;
            animation: epicText 1.5s ease-out;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        @keyframes epicText {
            0% { opacity: 0; transform: translateY(15px); letter-spacing: 15px; }
            40% { opacity: 1; transform: translateY(0); letter-spacing: 6px; }
            80% { opacity: 1; }
            100% { opacity: 0; letter-spacing: 20px; }
        }

        /* --- NUEVO LOGO CENTRAL RESPONSIVE Y OPTIMIZADO --- */
        .center-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            display: none;
            width: 100%;
            padding: 0 20px;
            pointer-events: none;
        }

        .center-logo.active {
            display: block;
            animation: logoReveal 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        @keyframes logoReveal {
            0% { 
                opacity: 0; 
                transform: translate(-50%, -40%); 
                filter: blur(15px);
            }
            100% { 
                opacity: 1; 
                transform: translate(-50%, -50%); 
                filter: blur(0);
            }
        }

        .center-logo-main {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3rem, 15vw, 6rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ff0000 0%, #ff3333 50%, #cc0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 
                0 0 20px rgba(255, 0, 0, 0.6),
                0 0 40px rgba(255, 0, 0, 0.3);
            letter-spacing: clamp(5px, 2vw, 15px);
            position: relative;
            display: inline-block;
            animation: logoGlow 3s ease-in-out infinite;
            line-height: 1.1;
            white-space: nowrap;
        }

        @keyframes logoGlow {
            0%, 100% { 
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
                opacity: 0.95;
            }
            50% { 
                text-shadow: 0 0 40px rgba(255, 0, 0, 0.9), 0 0 60px rgba(255, 0, 0, 0.4);
                opacity: 1;
            }
        }

        /* Efecto glitch más sutil para el logo central */
        .center-logo-main::before,
        .center-logo-main::after {
            content: 'CCSHOP';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff0000 0%, #ff3333 50%, #cc0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.7;
        }

        .center-logo-main::before {
            animation: subtleGlitch1 3s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }

        .center-logo-main::after {
            animation: subtleGlitch2 3.5s infinite linear alternate-reverse;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        }

        @keyframes subtleGlitch1 {
            0%, 95%, 100% { transform: translate(0); }
            97% { transform: translate(-1.5px, 0); }
            98% { transform: translate(1.5px, 0); }
        }

        @keyframes subtleGlitch2 {
            0%, 92%, 100% { transform: translate(0); }
            94% { transform: translate(1.5px, 0); }
            96% { transform: translate(-1.5px, 0); }
        }

        .center-logo-sub {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.8rem, 3vw, 1.2rem);
            color: #fff;
            letter-spacing: clamp(3px, 1.5vw, 8px);
            margin-top: 15px;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            animation: subGlow 2s ease-in-out infinite;
            opacity: 0.9;
        }

        @keyframes subGlow {
            0%, 100% { 
                text-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
                opacity: 0.8;
            }
            50% { 
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
                opacity: 1;
            }
        }

        .center-logo-year {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            color: #ff4444;
            letter-spacing: clamp(4px, 1.5vw, 10px);
            margin-top: 8px;
            font-weight: 600;
            opacity: 0.8;
        }

        /* Un anillo decorativo simple alrededor del logo */
        .center-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(80vw, 400px);
            height: min(80vw, 400px);
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 50%;
            animation: ringRotate 20s linear infinite;
            border-top-color: rgba(255, 0, 0, 0.5);
            border-bottom-color: rgba(255, 0, 0, 0.2);
            pointer-events: none;
        }

        @keyframes ringRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* --- FIN NUEVO LOGO CENTRAL --- */

        .notification {
            position: fixed; 
            top: 20px; 
            right: 20px; 
            padding: 12px 18px; 
            border-radius: 10px;
            color: white; 
            z-index: 1003; 
            display: none; 
            animation: slideIn 0.4s ease;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid;
        }
        
        .notification.error { 
            background: rgba(20, 0, 0, 0.95); 
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }
        
        .notification.success { 
            background: rgba(0, 20, 0, 0.95); 
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        @keyframes slideIn { 
            from { transform: translateX(100%); opacity: 0; } 
            to { transform: translateX(0); opacity: 1; } 
        }

        /* Panel de usuario en la esquina */
        .user-info { 
            position: fixed; 
            top: 20px; 
            left: 20px; 
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(8px);
            padding: 12px 18px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 0, 0, 0.4); 
            display: none; 
            z-index: 1002;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            font-size: 14px;
        }
        
        .user-name { 
            display: block; 
            font-weight: 700; 
            margin-bottom: 8px; 
            border-left: 3px solid #ff0000; 
            padding-left: 10px;
            letter-spacing: 1px;
        }
        
        .user-name.admin { 
            border-left-color: #00ff00; 
            color: #00ff00; 
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        
        .logout-button { 
            background: linear-gradient(135deg, #ff0000, #cc0000); 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            transition: all 0.3s;
            font-size: 13px;
        }
        
        .logout-button:hover {
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            transform: translateY(-1px);
        }

        .enter-button { 
            position: fixed; 
            bottom: 40px; 
            left: 50%; 
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff0000, #990000); 
            color: white; 
            padding: 14px 35px; 
            font-size: 15px; 
            font-weight: 700; 
            border-radius: 30px; 
            cursor: pointer; 
            display: none; 
            border: 2px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-family: 'Orbitron', sans-serif;
            animation: enterPulse 2s ease-in-out infinite;
            transition: all 0.3s;
            z-index: 1001;
        }

        @keyframes enterPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); transform: translateX(-50%) scale(1); }
            50% { box-shadow: 0 0 40px rgba(255, 0, 0, 0.7); transform: translateX(-50%) scale(1.03); }
        }

        .enter-button:hover {
            background: linear-gradient(135deg, #ff3333, #cc0000);
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
        }

        .admin-button { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: rgba(0, 255, 0, 0.1); 
            color: #00ff00; 
            border: 1px solid #00ff00; 
            padding: 8px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            display: none; 
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 12px;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
            z-index: 1001;
        }

        .admin-button:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }

        .container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="particles" id="particles"></div>

    <video class="background-video" autoplay muted loop id="bgVideo">
        <source src="log2.mp4" type="video/mp4">
    </video>

    <!-- LOGO CENTRAL REDISEÑADO - MÁS ELEGANTE Y RESPONSIVE -->
    <div class="center-logo" id="centerLogo">
        <div class="center-ring"></div>
        <div class="center-logo-main">CCSHOP</div>
        <div class="center-logo-sub">VISA · MASTERCARD</div>
        <div class="center-logo-year">2026</div>
    </div>

    <div class="login-epic" id="loginEpic">
        <div class="energy-ring"></div>
        <div class="epic-text">ACCESO CONCEDIDO</div>
    </div>

    <div class="notification" id="notification"></div>

    <div class="user-info" id="userInfo">
        <span class="user-name" id="userName"></span>
        <button class="logout-button" onclick="logout()">🚪 CERRAR SESIÓN</button>
    </div>

    <button class="admin-button" id="adminButton" onclick="adminAccess()">⚡ ADMIN</button>

    <div class="container" id="mainContainer">
        <div class="scan-line"></div>
        <div class="logo-container"><div class="logo">CCSHOP</div></div>
        <div class="login-container">
            <video class="security-video" autoplay muted loop><source src="dinero_1.mp4" type="video/mp4"></video>
            
            <div class="security-title">💳 VISA/MASTERCARD 💳</div>
            
            <div class="anonymity-warning">
                <span>⚠️</span> 
                NO USES CORREO PERSONAL - MANTÉN ANONIMATO
                <span>⚠️</span>
            </div>
            
            <button class="google-button" id="googleButton" onclick="signInWithGoogle()">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#ff6666" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#ff6666" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#ff6666" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43-.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#ff6666" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>

    <button class="enter-button" id="enterButton" onclick="enterPage()">► ACCEDER</button>

<!-- AGREGAR ESTE PANEL DE DEPURACIÓN JUSTO DESPUÉS DEL BODY -->
<div id="debugPanel" style="position: fixed; top: 10px; left: 10px; right: 10px; background: rgba(0,0,0,0.9); border: 2px solid red; border-radius: 10px; padding: 15px; z-index: 10000; color: white; font-family: monospace; font-size: 14px; max-height: 80vh; overflow-y: auto; display: none;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <span style="color: #ff0000; font-weight: bold;">🔍 DEBUG MODE</span>
        <button onclick="document.getElementById('debugPanel').style.display='none'" style="background: red; border: none; color: white; border-radius: 5px; padding: 5px 10px;">✖</button>
    </div>
    <div id="debugContent" style="white-space: pre-wrap; word-break: break-word;"></div>
</div>

<!-- BOTÓN FLOTANTE PARA ABRIR DEBUG -->
<button onclick="toggleDebug()" style="position: fixed; bottom: 20px; left: 20px; z-index: 10001; background: red; color: white; border: none; border-radius: 50px; padding: 12px 20px; font-weight: bold; box-shadow: 0 0 20px red;">🔧 DEBUG</button>

<script>
    // ========================================
    // SISTEMA DE DEPURACIÓN VISUAL PARA MÓVIL
    // ========================================
    function toggleDebug() {
        const panel = document.getElementById('debugPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        actualizarDebug();
    }
    
    function actualizarDebug() {
        const content = document.getElementById('debugContent');
        if (!content) return;
        
        let html = '<strong>📱 INFORMACIÓN:</strong><br>';
        html += `🕒 ${new Date().toLocaleString()}<br>`;
        html += `🌐 URL: ${window.location.href}<br>`;
        html += `🔐 Auth: ${firebase.auth().currentUser ? '✅ Conectado' : '❌ No conectado'}<br><br>`;
        
        html += '<strong>📋 ÚLTIMOS ERRORES:</strong><br>';
        if (window.erroresDebug && window.erroresDebug.length > 0) {
            window.erroresDebug.slice(-5).forEach(err => {
                html += `❌ ${err}<br>`;
            });
        } else {
            html += '✅ Sin errores recientes<br>';
        }
        
        html += '<br><strong>📊 ESTADO:</strong><br>';
        if (firebase.auth().currentUser) {
            html += `👤 ${firebase.auth().currentUser.email}<br>`;
        }
        
        content.innerHTML = html;
    }
    
    // Capturar errores globales
    window.erroresDebug = [];
    window.onerror = function(msg, url, line) {
        const errorMsg = `${msg} - Línea: ${line}`;
        window.erroresDebug.push(errorMsg);
        actualizarDebug();
        
        // Mostrar notificación visible
        showNotify(`⚠️ Error: ${msg}`, 'error');
        return false;
    };
    
    // ========================================
    // VERSIÓN SIMPLIFICADA DE FIREBASE
    // ========================================
    const firebaseConfig = {
        apiKey: "AIzaSyD2tvQjJzh7ukTSyxzIQSo7GSpz7L8z11I",
        authDomain: "ccshop-realtime.firebaseapp.com",
        databaseURL: "https://ccshop-realtime-default-rtdb.firebaseio.com",
        projectId: "ccshop-realtime",
        storageBucket: "ccshop-realtime.firebasestorage.app",
        messagingSenderId: "795626673305",
        appId: "1:795626673305:web:094dc265de1d4d1bc7d408"
    };

    try {
        firebase.initializeApp(firebaseConfig);
        window.erroresDebug.push('✅ Firebase inicializado');
    } catch (e) {
        window.erroresDebug.push('❌ Error Firebase: ' + e.message);
    }
    
    const auth = firebase.auth();
    const db = firebase.database();
    let currentUser = null;
    const ADMIN_EMAIL = 'johndoechmod777@gmail.com';

    // NOTIFICACIONES VISIBLES
    function showNotify(msg, type = 'success') {
        const n = document.getElementById('notification');
        if (n) {
            n.textContent = msg;
            n.className = `notification ${type}`;
            n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 4000);
        }
        
        // También al panel debug
        window.erroresDebug.push(`${type === 'error' ? '❌' : '✅'} ${msg}`);
        actualizarDebug();
    }

    // ANIMACIÓN
    function createEpicAnimation() {
        const epic = document.getElementById('loginEpic');
        if (epic) {
            epic.classList.add('active');
            setTimeout(() => epic.classList.remove('active'), 1500);
        }
    }

    // VERSIÓN MUY SIMPLIFICADA - SIN DEPENDENCIA DE DB PRIMERO
    async function signInWithGoogle() {
        createEpicAnimation();
        showNotify('🔄 Iniciando sesión...', 'success');
        
        const provider = new firebase.auth.GoogleAuthProvider();
        
        try {
            window.erroresDebug.push('🔵 Abriendo popup de Google...');
            actualizarDebug();
            
            const result = await auth.signInWithPopup(provider);
            
            if (!result || !result.user) {
                throw new Error('No se obtuvo usuario');
            }
            
            currentUser = result.user;
            window.erroresDebug.push(`✅ Usuario: ${currentUser.email}`);
            actualizarDebug();
            
            // PRIMERO: Mostrar dashboard aunque falle la DB
            showDashboard(currentUser);
            showNotify('✅ ACCESO CONCEDIDO');
            
            // SEGUNDO: Intentar sincronización (no crítica)
            try {
                await syncUserSimple(currentUser);
                window.erroresDebug.push('✅ Sincronización DB exitosa');
            } catch (dbError) {
                window.erroresDebug.push('⚠️ Error DB (no crítico): ' + dbError.message);
                showNotify('⚠️ Sin sincronización', 'error');
            }
            
        } catch (error) {
            window.erroresDebug.push('❌ ' + error.message);
            actualizarDebug();
            
            let errorMsg = 'ERROR DE ACCESO';
            if (error.code === 'auth/popup-blocked') {
                errorMsg = '⚠️ Popup bloqueado - Permite ventanas emergentes';
            } else if (error.code === 'auth/network-request-failed') {
                errorMsg = '📶 Sin conexión a internet';
            } else if (error.code === 'auth/cancelled-popup-request') {
                errorMsg = '✖️ Cancelado';
            } else if (error.message.includes('popup')) {
                errorMsg = '⚠️ Habilita popups para este sitio';
            }
            
            showNotify(errorMsg, 'error');
        }
    }
// SINCRONIZACIÓN ULTRA SIMPLE - SOLO LO BÁSICO
async function syncUserSimple(user) {
    if (!user || !user.uid) return;
    
    try {
        console.log('UID:', user.uid);
        console.log('Email:', user.email);
        console.log('Path:', 'users/' + user.uid);
        
        const userRef = db.ref('users/' + user.uid);
        const isAdmin = user.email === ADMIN_EMAIL;
        
        // Probar permisos de lectura primero
        const snap = await userRef.once('value');
        console.log('✅ Puede LEER, datos actuales:', snap.val());
        
        // DATOS MÍNIMOS - SOLO 3 CAMPOS
        const datosMinimos = {
            email: user.email,
            saldo: 0,
            ultimoAcceso: Date.now()
        };
        
        console.log('Intentando guardar:', datosMinimos);
        
        // Guardar solo los 3 campos básicos
        await userRef.set(datosMinimos);
        console.log('✅ Guardado exitoso');
        
        // Si es admin, guardar aparte
        if (isAdmin) {
            await db.ref('admins/' + user.uid).set(true);
            console.log('✅ Admin marcado');
        }
        
        window.erroresDebug.push('✅ DB: Usuario guardado');
        actualizarDebug();
        
    } catch (error) {
        console.error('❌ Error DB detallado:', error);
        console.error('❌ Código:', error.code);
        console.error('❌ Mensaje:', error.message);
        window.erroresDebug.push('❌ DB Error: ' + error.code + ' - ' + error.message);
        actualizarDebug();
        throw error;
    }
}// SINCRONIZACIÓN COMPLETA - CON TODOS LOS CAMPOS
async function syncUserSimple(user) {
    if (!user || !user.uid) return;
    
    try {
        console.log('UID:', user.uid);
        console.log('Email:', user.email);
        
        const userRef = db.ref('users/' + user.uid);
        const isAdmin = user.email === ADMIN_EMAIL;
        
        // Verificar si el usuario ya existe
        const snapshot = await userRef.once('value');
        const existe = snapshot.exists();
        const datosExistentes = snapshot.val() || {};
        
        // DATOS COMPLETOS - TODOS LOS CAMPOS
        const datosCompletos = {
            email: user.email,
            nombre: user.displayName || user.email.split('@')[0] || 'Usuario',
            saldo: existe ? datosExistentes.saldo || 0 : 0,  // Si existe, mantener saldo
            ultimoAcceso: Date.now(),
            fechaRegistro: existe ? datosExistentes.fechaRegistro : Date.now(),  // Solo si es nuevo
            esAdmin: isAdmin
        };
        
        console.log('Guardando datos completos:', datosCompletos);
        
        // Guardar TODOS los campos
        await userRef.set(datosCompletos);
        console.log('✅ Usuario guardado con todos los campos');
        
        // Si es admin, guardar también en admins
        if (isAdmin) {
            await db.ref('admins/' + user.uid).set(true);
            console.log('✅ Admin marcado');
        }
        
        window.erroresDebug.push('✅ DB: Usuario guardado (completo)');
        actualizarDebug();
        
    } catch (error) {
        console.error('❌ Error DB:', error);
        window.erroresDebug.push('❌ DB Error: ' + error.code);
        actualizarDebug();
        throw error;
    }
}
    // DASHBOARD
    function showDashboard(user) {
        document.getElementById('mainContainer').style.display = 'none';
        document.getElementById('bgVideo').style.display = 'block';
        document.getElementById('enterButton').style.display = 'block';
        document.getElementById('centerLogo').classList.add('active');
        
        const userInfo = document.getElementById('userInfo');
        const userNameText = document.getElementById('userName');
        userInfo.style.display = 'block';
        
        const isAdmin = user.email === ADMIN_EMAIL;
        userNameText.textContent = isAdmin ? `👑 ${user.displayName || 'Admin'}` : `👤 ${user.displayName || 'Usuario'}`;
        
        if(isAdmin) {
            userNameText.classList.add('admin');
            document.getElementById('adminButton').style.display = 'block';
        }
    }

    // LOGOUT
    async function logout() {
        await auth.signOut();
        location.reload();
    }

    function enterPage() {
        window.location.href = 'verificacion.html';
    }

    function adminAccess() {
        window.location.href = 'admin.html';
    }

    // AUTH STATE
    auth.onAuthStateChanged((user) => {
        if (user) {
            window.erroresDebug.push(`✅ Auth: ${user.email}`);
            currentUser = user;
            showDashboard(user);
        } else {
            window.erroresDebug.push('⚪ No autenticado');
            document.getElementById('mainContainer').style.display = 'block';
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('centerLogo').classList.remove('active');
            document.getElementById('bgVideo').style.display = 'none';
            document.getElementById('enterButton').style.display = 'none';
            document.getElementById('adminButton').style.display = 'none';
        }
        actualizarDebug();
    });

    // PARTÍCULAS
    function crearParticulas() {
        const container = document.getElementById('particles');
        if (!container) return;
        for (let i = 0; i < 10; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (5 + Math.random() * 8) + 's';
            p.style.animationDelay = Math.random() * 3 + 's';
            container.appendChild(p);
        }
    }

    window.onload = () => {
        document.body.style.opacity = '1';
        crearParticulas();
        actualizarDebug();
    };
</script>
</body>
