<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCSHOP · Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .panel {
            background: #111;
            border: 2px solid #ff0000;
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        h1 {
            color: #ff0000;
            margin-bottom: 15px;
            font-size: 24px;
        }
        .admin-email {
            color: #0f0;
            margin-bottom: 25px;
            font-size: 12px;
            word-break: break-all;
        }
        button {
            background: #ff0000;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
        }
        .google-btn {
            background: #4285f4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .google-btn:hover {
            background: #3367d6;
        }
        .logout-btn {
            background: #333;
        }
        .status {
            margin: 15px 0;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
        }
        .status-loading { background: rgba(255,165,0,0.2); color: #ffaa00; }
        .status-success { background: rgba(0,255,0,0.2); color: #0f0; }
        .status-error { background: rgba(255,0,0,0.2); color: #ff6666; }
        .warning {
            font-size: 11px;
            color: #ff6666;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #222;
        }
        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="panel" id="loginPanel">
    <h1>🔴 PANEL ADMIN</h1>
    <div id="status" class="status status-loading">Verificando acceso...</div>
    
    <div id="loginSection">
        <button class="google-btn" onclick="iniciarSesion()">
            🚪 INICIAR CON GOOGLE
        </button>
    </div>
    
    <div id="adminSection" style="display:none;">
        <div class="user-info">
            <div class="avatar" id="userAvatar">👤</div>
            <div id="adminEmail" class="admin-email"></div>
        </div>
        <button onclick="cerrarSesionATodos()">
            🚪 CERRAR SESIÓN A TODOS
        </button>
        <button class="logout-btn" onclick="cerrarMiSesion()">
            🔒 Cerrar mi sesión
        </button>
    </div>
    
    <div class="warning">
        ⚠️ Solo el administrador puede usar este panel
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD2tvQjJzh7ukTSyxzIQSo7GSpz7L8z11I",
        authDomain: "ccshop-realtime.firebaseapp.com",
        databaseURL: "https://ccshop-realtime-default-rtdb.firebaseio.com",
        projectId: "ccshop-realtime",
        storageBucket: "ccshop-realtime.firebasestorage.app",
        messagingSenderId: "795626673305",
        appId: "1:795626673305:web:094dc265de1d4d1bc7d408"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const ADMIN_EMAIL = 'johndoechmod777@gmail.com';

    async function iniciarSesion() {
        const provider = new firebase.auth.GoogleAuthProvider();
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = '🔄 Iniciando sesión...';
        statusDiv.className = 'status status-loading';
        
        try {
            const result = await auth.signInWithPopup(provider);
            verificarAcceso(result.user);
        } catch (error) {
            statusDiv.innerHTML = '❌ Error: ' + error.message;
            statusDiv.className = 'status status-error';
        }
    }

    async function cerrarSesionATodos() {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = '🔄 Enviando orden...';
        statusDiv.className = 'status status-loading';
        
        try {
            await db.ref('banned/global').set({
                forceLogout: true,
                timestamp: Date.now()
            });
            
            statusDiv.innerHTML = '✅ ¡Comando enviado! Todos los usuarios cerrarán sesión.';
            statusDiv.className = 'status status-success';
            
            setTimeout(() => {
                auth.signOut();
                location.reload();
            }, 2000);
            
        } catch (error) {
            statusDiv.innerHTML = '❌ Error: ' + error.message;
            statusDiv.className = 'status status-error';
        }
    }

    function cerrarMiSesion() {
        auth.signOut();
        location.reload();
    }

    function verificarAcceso(user) {
        const statusDiv = document.getElementById('status');
        const loginSection = document.getElementById('loginSection');
        const adminSection = document.getElementById('adminSection');
        
        if (user && user.email === ADMIN_EMAIL) {
            statusDiv.innerHTML = '✅ Acceso concedido';
            statusDiv.className = 'status status-success';
            document.getElementById('adminEmail').innerHTML = user.email;
            document.getElementById('userAvatar').innerHTML = user.displayName ? user.displayName.charAt(0).toUpperCase() : '👑';
            loginSection.style.display = 'none';
            adminSection.style.display = 'block';
        } else if (user) {
            statusDiv.innerHTML = '⛔ No eres administrador. Cerrando sesión...';
            statusDiv.className = 'status status-error';
            setTimeout(() => {
                auth.signOut();
                location.reload();
            }, 2000);
        } else {
            statusDiv.innerHTML = '🔴 Inicia sesión con tu cuenta de Google';
            statusDiv.className = 'status status-error';
            loginSection.style.display = 'block';
            adminSection.style.display = 'none';
        }
    }

    auth.onAuthStateChanged((user) => {
        verificarAcceso(user);
    });
</script>

</body>
</html>
